backend:
  name: turbo-github
  turbo_site_id: 03204bc5-f4d3-486b-bc97-a71cc4167d9b
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "books"
    label: "Reading List Books"
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - label: "Reading Status"
        name: "status"
        widget: "select"
        options:
          - { label: "Want to Read", value: "want" }
          - { label: "Currently Reading", value: "reading" }
          - { label: "Books I've Read", value: "read" }
      - { label: "Rating (out of 5; half stars allowed)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5, required: false }
      - { label: "Notes / Impression", name: "impression", widget: "text", required: false }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", min: 0, required: false, hint: "Lower numbers appear first within a section." }

  - name: "pages"
    label: "Site Pages"
    files:
      - name: "about"
        label: "About Page"
        file: "src/content/pages/about.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Body"
            name: "body"
            widget: "markdown"
      - name: "now"
        label: "Now Page"
        file: "src/content/pages/now.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Body"
            name: "body"
            widget: "markdown"
      - name: "uses"
        label: "Uses Page"
        file: "src/content/pages/uses.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Body"
            name: "body"
            widget: "markdown"
      - name: "reading-list"
        label: "Reading List"
        file: "src/content/pages/reading-list.md"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Body"
            name: "body"
            widget: "markdown"
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true

    slug: "{{slug}}"

    extension: "md"
    format: "frontmatter"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Publication Date"
        name: "pubDate"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Ideas & Observations"
          - "Writing Life"
          - "Faith & Discovery"
          - "Projects & Updates"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Image Alt Text"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Briefly describe the image for readers using screen readers."

      - label: "Draft"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "Body"
        name: "body"
        widget: "markdown"